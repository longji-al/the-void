 <!DOCTYPE html>
<html>
<head>
<title>THE VOID</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    cursor: crosshair;
}

canvas {
    position: fixed;
    inset: 0;
}

.title {
    position: fixed;
    top: 40px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 45px;
    letter-spacing: 15px;
    text-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff,
        0 0 60px #0066ff;
    pointer-events: none;
}

.subtitle {
    position: fixed;
    top: 100px;
    width: 100%;
    text-align: center;
    color: #77ffff;
    letter-spacing: 5px;
    font-size: 12px;
    pointer-events: none;
}

.center {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%,
        white 0%,
        #00ffff 5%,
        #0066ff 25%,
        #110033 65%,
        #000 75%);
    box-shadow:
        0 0 30px #00ffff,
        0 0 80px #0066ff,
        0 0 150px #3300ff;
    animation: pulse 3s infinite alternate;
}

@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(1);
    }

    to {
        transform: translate(-50%, -50%) scale(1.12);
    }
}

.ring {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 420px;
    height: 120px;
    border: 2px solid #00ffff88;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-20deg);
    box-shadow: 0 0 20px #00ffff55;
    pointer-events: none;
}

.message {
    position: fixed;
    bottom: 50px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 15px;
    letter-spacing: 4px;
    opacity: .7;
}

button {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 30px;
    background: transparent;
    color: #00ffff;
    border: 1px solid #00ffff;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 3px;
    box-shadow: 0 0 15px #00ffff55;
}

button:hover {
    background: #00ffff;
    color: #000;
    box-shadow: 0 0 40px #00ffff;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="title">THE VOID</div>
<div class="subtitle">WELCOME TO THE UNKNOWN</div>

<div class="center"></div>
<div class="ring"></div>

<div class="message" id="message">
MOVE YOUR MOUSE
</div>

<button onclick="activate()">ENTER THE VOID</button>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let mouse = {
    x: innerWidth / 2,
    y: innerHeight / 2
};

let stars = [];

for (let i = 0; i < 500; i++) {

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 2 + .2
    });
}

document.addEventListener("mousemove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});

function animate() {

    ctx.fillStyle = "rgba(0,0,10,.25)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    stars.forEach(star => {

        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }

        let dx = mouse.x - star.x;
        let dy = mouse.y - star.y;

        let distance = Math.sqrt(dx*dx + dy*dy);

        if (distance < 150) {
            star.x -= dx * .01;
            star.y -= dy * .01;
        }

        ctx.beginPath();

        ctx.fillStyle = "#ffffff";

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffff";

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

    requestAnimationFrame(animate);
}

animate();

function activate() {

    document.getElementById("message").innerText =
        "YOU HAVE ENTERED THE VOID";

    document.body.style.background =
        "radial-gradient(circle, #050020, #000)";

}

window.addEventListener("resize", () => {

    canvas.width = innerWidth;
    canvas.height = innerHeight;

});

</script>

</body>
</html>
